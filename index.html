<!DOCTYPE html><html lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة مراقبة Tawsil Star AI</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      direction: rtl;
      background-color: #f0f4f8;
      color: #333;
      margin: 0;
      padding: 0;
    }
    header {
      background-color: #2c3e50;
      color: white;
      padding: 1rem;
      text-align: center;
    }
    .container {
      padding: 2rem;
    }
    .card {
      background: white;
      padding: 1rem;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      margin-bottom: 1rem;
    }
    .card h3 {
      margin-top: 0;
    }
    .btn {
      background-color: #3498db;
      color: white;
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header>
    <h1>لوحة مراقبة Tawsil Star AI</h1>
  </header>
  <div class="container">
    <div class="card">
      <h3>عدد الشكاوى اليوم</h3>
      <p id="complaints-count">0</p>
    </div>
    <div class="card">
      <h3>مشرفو الولايات</h3>
      <ul id="supervisors-list">
        <li>البويرة: 0792593020</li>
        <li>الجزائر: 0775877088</li>
        <li>سطيف: 0670279603</li>
      </ul>
    </div>
    <div class="card">
      <h3>شكاوى حديثة</h3>
      <ul id="recent-complaints">
        <li>الزبون: عمر بن عيسى، الولاية: الجزائر، السبب: تأخير في التوصيل</li>
      </ul>
      <button class="btn" onclick="alert('تحديث البيانات...')">تحديث</button>
    </div>
  </div>
</body>
</html>
