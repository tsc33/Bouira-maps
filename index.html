<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خريطة المطاعم في ولاية البويرة</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
    <style>
        #map {
            height: 500px;
        }
    </style>
</head>
<body>
    <h1>خريطة المطاعم في ولاية البويرة</h1>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script>
        var map = L.map('map').setView([36.3715, 3.1209], 12); // إحداثيات ولاية البويرة

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        // إضافة نقاط لمطاعم
        var restaurants = [
            {
                name: "مطعم 1",
                lat: 36.372,
                lng: 3.131
            },
            {
                name: "مطعم 2",
                lat: 36.373,
                lng: 3.132
            }
        ];

        restaurants.forEach(function(restaurant) {
            L.marker([restaurant.lat, restaurant.lng])
                .addTo(map)
                .bindPopup('<b>' + restaurant.name + '</b><br>رقم الهاتف: 1234567890<br>نوع المطعم: مطبخ جزائري');
        });
    </script>
</body>
</html>
